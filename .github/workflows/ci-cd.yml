name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CI: Automated Quality, Linting & Formatting Checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML (HTMLHint)
        run: npx --yes htmlhint index.html

      - name: Check Formatting (Prettier)
        run: npx --yes prettier --check "css/**/*.css" "js/**/*.js"

      - name: Check Broken Links (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude "linkedin.com" --exclude "twitter.com" --exclude "x.com" index.html
          fail: false

  # CD: Deploy to GitHub Pages (Runs only on push to main)
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: lint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
